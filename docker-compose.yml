# Sobe API + agente do WhatsApp + PostgreSQL (bancos "financas" e "agente"):
#   cp .env.example .env   (preencha)
#   docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: financas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financas"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    ports: ["5000:5000"]
    environment:
      ConnectionStrings__Default: Host=db;Database=financas;Username=postgres;Password=${POSTGRES_PASSWORD}
      DeepSeek__ApiKey: ${DEEPSEEK_API_KEY}
      Agent__ApiKey: ${AGENT_API_KEY}
      Jwt__Key: ${JWT_KEY}
      # Origens web liberadas no CORS (o app mobile não precisa). Ex.: https://app.seudominio.com.br
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-}
      # Ligue só se a API estiver atrás de um proxy reverso (nginx, Caddy, Cloudflare)
      ReverseProxy__TrustForwardedHeaders: ${TRUST_PROXY:-false}
    depends_on:
      db: { condition: service_healthy }

  agent:
    build: ./agent
    ports: ["8000:8000"]
    env_file: .env
    environment:
      FINANCE_API_URL: http://api:5000
      # Histórico, mensagens já vistas e fila por telefone ficam no Postgres:
      # o agente pode rodar com várias réplicas atrás de um balanceador.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/agente
    volumes: [whisper-models:/models]
    depends_on:
      api: { condition: service_started }
      db: { condition: service_healthy }

volumes:
  pg-data:
  whisper-models:
